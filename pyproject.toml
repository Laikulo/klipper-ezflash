[build-system]
requires = ['setuptools', 'setuptools-scm']
build-backend = "setuptools.build_meta"

[project]
name = 'kboard'
authors = [
    {name = "Laikulo", email = "aaron@haun.guru"},
    {name = "TheRougeZeta", email = "idk@idk.invalid"}
]
dynamic = ["version"]
dependencies = [
    'kconfiglib-klipper',
    'pythondialog',
]

[tool.setuptools_scm]

[tool.setuptools.packages.find]
include = ["klipper_ezflash", "klipper_ezflash.*"]

[tool.setuptools.package-data]
"klipper_ezflash.boards" = [ "*.json" ]

[project.scripts]
"check_kboards" = "klipper_ezflash.scripts.test_all_boards:main"
"ezf" = "klipper_ezflash.__main__:main"
"ezflash" = "klipper_ezflash.__main__:main"
